<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cutline — MP3 Trimmer</title>
<meta name="description" content="Trim MP3 or MP4 audio to an exact mm:ss range and export a high-quality MP3, entirely offline in your browser.">
<meta name="theme-color" content="#14161A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161A;
    --panel:#1C1F24;
    --panel-raised:#22262C;
    --border:#2C3036;
    --border-bright:#3A3F46;
    --text:#ECEAE4;
    --text-dim:#8A8F98;
    --text-faint:#5A5F68;
    --accent:#C08A3E;
    --accent-bright:#D9A257;
    --teal:#4A7A78;
    --danger:#B8654F;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(192,138,62,0.06), transparent);
    color:var(--text);
    font-family:var(--font-ui);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:28px 16px 40px;
  }
  .device{
    width:100%;
    max-width:440px;
  }

  /* ---------- Nameplate ---------- */
  .nameplate{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:0 4px 18px;
    border-bottom:1px solid var(--border);
    margin-bottom:20px;
  }
  .nameplate h1{
    font-size:19px;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }
  .nameplate .mark{
    color:var(--accent);
  }
  .nameplate .tagline{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-faint);
    letter-spacing:0.02em;
  }

  /* ---------- Panels ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px;
    margin-bottom:14px;
  }
  .panel-label{
    font-size:12px;
    color:var(--text-dim);
    margin:0 0 12px;
    font-weight:500;
  }

  /* ---------- Drop zone ---------- */
  .dropzone{
    border:1.5px dashed var(--border-bright);
    border-radius:8px;
    padding:28px 16px;
    text-align:center;
    cursor:pointer;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--accent);
    background:rgba(192,138,62,0.04);
  }
  .dropzone svg{ margin-bottom:10px; opacity:0.55; }
  .dropzone .primary{ font-size:14px; font-weight:500; margin-bottom:4px; }
  .dropzone .secondary{ font-size:12.5px; color:var(--text-faint); }
  .dropzone input{ display:none; }

  /* ---------- Loaded file row ---------- */
  .file-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .file-icon{
    width:38px; height:38px; flex:none;
    border-radius:6px;
    background:var(--panel-raised);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .file-meta{ min-width:0; flex:1; }
  .file-name{
    font-size:13.5px; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .file-duration{
    font-family:var(--font-mono);
    font-size:11.5px; color:var(--text-dim);
    margin-top:2px;
  }
  .file-clear{
    flex:none;
    width:28px; height:28px;
    border-radius:6px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .file-clear:hover{ border-color:var(--danger); color:var(--danger); }

  audio.preview{
    width:100%;
    margin-top:14px;
    height:34px;
    filter:invert(0.9) hue-rotate(180deg);
    border-radius:6px;
  }

  /* ---------- Timecode inputs ---------- */
  .timecode-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .timecode-field label{
    display:block;
    font-size:11.5px;
    color:var(--text-dim);
    margin-bottom:7px;
  }
  .timecode-box{
    display:flex;
    align-items:center;
    background:var(--panel-raised);
    border:1px solid var(--border);
    border-radius:7px;
    padding:9px 10px;
    gap:2px;
    transition:border-color 0.15s ease;
  }
  .timecode-box:focus-within{
    border-color:var(--accent);
  }
  .timecode-box.invalid{
    border-color:var(--danger);
  }
  .timecode-box input{
    width:26px;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:18px;
    font-weight:500;
    text-align:center;
    padding:0;
  }
  .timecode-box .colon{
    font-family:var(--font-mono);
    font-size:18px;
    color:var(--text-faint);
    padding:0 1px;
  }
  .timecode-box .unit{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--text-faint);
    margin-left:auto;
  }

  .range-hint{
    font-size:11.5px;
    color:var(--text-faint);
    margin-top:10px;
    display:flex;
    justify-content:space-between;
  }
  .range-hint .duration{ font-family:var(--font-mono); color:var(--text-dim); }
  .error-text{
    font-size:12px;
    color:var(--danger);
    margin-top:10px;
    display:none;
  }
  .error-text.show{ display:block; }

  /* ---------- Buttons ---------- */
  .btn{
    width:100%;
    padding:13px 16px;
    border-radius:8px;
    border:1px solid transparent;
    font-family:var(--font-ui);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:opacity 0.15s ease, transform 0.05s ease;
  }
  .btn:active{ transform:scale(0.99); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-primary{
    background:var(--accent);
    color:#14161A;
  }
  .btn-primary:hover:not(:disabled){ background:var(--accent-bright); }
  .btn-secondary{
    background:transparent;
    border-color:var(--border-bright);
    color:var(--text);
  }
  .btn-secondary:hover{ border-color:var(--teal); }

  /* ---------- Progress ---------- */
  .progress-wrap{ display:none; }
  .progress-wrap.show{ display:block; }
  .progress-label{
    display:flex; justify-content:space-between;
    font-size:11.5px; color:var(--text-dim);
    margin-bottom:8px;
    font-family:var(--font-mono);
  }
  .progress-track{
    height:5px;
    background:var(--panel-raised);
    border:1px solid var(--border);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--teal), var(--accent));
    transition:width 0.2s ease;
  }
  .progress-wrap.error .progress-track{ border-color:var(--danger); }
  .progress-wrap #export-error{ margin-top:12px; margin-bottom:0; }

  /* ---------- Output ---------- */
  .output-panel{ display:none; }
  .output-panel.show{ display:block; }
  .output-head{
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .output-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 8px var(--teal);
    flex:none;
  }
  .output-head .t{ font-size:13.5px; font-weight:500; }
  .output-head .s{ font-size:11.5px; color:var(--text-dim); margin-left:auto; font-family:var(--font-mono); }
  .btn-row{ display:flex; gap:10px; margin-top:14px; }
  .btn-row .btn{ margin:0; }

  /* ---------- Footer ---------- */
  .footnote{
    text-align:center;
    font-size:11px;
    color:var(--text-faint);
    margin-top:22px;
    line-height:1.6;
  }
  .install-hint{ display:none; text-align:center; margin-top:14px; }
  .install-hint.show{ display:block; }
  .install-hint button{
    background:transparent; border:1px solid var(--border-bright);
    color:var(--text-dim); font-size:12px; padding:8px 14px;
    border-radius:7px; cursor:pointer; font-family:var(--font-ui);
  }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="device">

  <div class="nameplate">
    <div>
      <h1><span class="mark">Cut</span>line</h1>
    </div>
    <div class="tagline">mp3 / mp4 &rarr; mp3</div>
  </div>

  <!-- Source -->
  <div class="panel" id="source-panel">
    <p class="panel-label">Source file</p>

    <div class="dropzone" id="dropzone">
      <input type="file" id="file-input" accept="audio/*,video/mp4,.mp3,.mp4,.m4a,.wav,.aac,.ogg">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A8F98" stroke-width="1.4"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      <div class="primary">Tap to choose a file</div>
      <div class="secondary">MP3, MP4, M4A, WAV — audio track only</div>
    </div>

    <div class="file-row hidden" id="file-row">
      <div class="file-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C08A3E" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="file-meta">
        <div class="file-name" id="file-name">&mdash;</div>
        <div class="file-duration" id="file-duration">&mdash;</div>
      </div>
      <button class="file-clear" id="file-clear" title="Remove file" aria-label="Remove file">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <audio class="preview hidden" id="source-preview" controls></audio>
  </div>

  <!-- Range -->
  <div class="panel hidden" id="range-panel">
    <p class="panel-label">Trim range</p>
    <div class="timecode-row">
      <div class="timecode-field">
        <label for="start-mm">Start</label>
        <div class="timecode-box" id="start-box">
          <input type="text" inputmode="numeric" maxlength="2" id="start-mm" value="00" aria-label="Start minutes">
          <span class="colon">:</span>
          <input type="text" inputmode="numeric" maxlength="2" id="start-ss" value="00" aria-label="Start seconds">
          <span class="unit">mm:ss</span>
        </div>
      </div>
      <div class="timecode-field">
        <label for="end-mm">End</label>
        <div class="timecode-box" id="end-box">
          <input type="text" inputmode="numeric" maxlength="2" id="end-mm" value="00" aria-label="End minutes">
          <span class="colon">:</span>
          <input type="text" inputmode="numeric" maxlength="2" id="end-ss" value="00" aria-label="End seconds">
          <span class="unit">mm:ss</span>
        </div>
      </div>
    </div>
    <div class="range-hint">
      <span id="range-length">Clip length &mdash; 00:00</span>
      <span class="duration" id="range-total">/ 00:00</span>
    </div>
    <div class="error-text" id="range-error"></div>
  </div>

  <!-- Action -->
  <button class="btn btn-primary hidden" id="cut-btn" disabled>Cut &amp; export MP3</button>

  <div class="panel progress-wrap" id="progress-panel">
    <div class="progress-label">
      <span id="progress-stage">Loading engine&hellip;</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="error-text" id="export-error"></div>
  </div>

  <!-- Output -->
  <div class="panel output-panel" id="output-panel">
    <div class="output-head">
      <span class="output-dot"></span>
      <span class="t">Export ready</span>
      <span class="s" id="output-size">&mdash;</span>
    </div>
    <audio class="preview" id="output-preview" controls></audio>
    <div class="btn-row">
      <button class="btn btn-secondary" id="reset-btn">Cut another</button>
      <a class="btn btn-primary" id="download-link" download style="text-align:center; text-decoration:none; display:flex; align-items:center; justify-content:center;">Download</a>
    </div>
  </div>

  <div class="install-hint" id="install-hint">
    <button id="install-btn">Add to home screen</button>
  </div>

  <p class="footnote">Processing runs on this device. Your audio is never uploaded.<br>320&nbsp;kbps MP3 output.</p>

</div>

<script type="module">
import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
import { fetchFile, toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

const CORE_BASE = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
const FFMPEG_WORKER_URL = 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/worker.js';

const $ = (id) => document.getElementById(id);

const dropzone = $('dropzone');
const fileInput = $('file-input');
const fileRow = $('file-row');
const fileNameEl = $('file-name');
const fileDurationEl = $('file-duration');
const fileClear = $('file-clear');
const sourcePreview = $('source-preview');

const rangePanel = $('range-panel');
const startMM = $('start-mm'), startSS = $('start-ss');
const endMM = $('end-mm'), endSS = $('end-ss');
const startBox = $('start-box'), endBox = $('end-box');
const rangeLength = $('range-length');
const rangeTotal = $('range-total');
const rangeError = $('range-error');

const cutBtn = $('cut-btn');
const progressPanel = $('progress-panel');
const progressFill = $('progress-fill');
const progressPct = $('progress-pct');
const progressStage = $('progress-stage');
const exportError = $('export-error');

const outputPanel = $('output-panel');
const outputPreview = $('output-preview');
const outputSize = $('output-size');
const downloadLink = $('download-link');
const resetBtn = $('reset-btn');

let currentFile = null;
let sourceDuration = 0;
let ffmpeg = null;
let ffmpegLoading = null;

function pad2(n){ return String(n).padStart(2,'0'); }
function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return `${pad2(m)}:${pad2(s)}`;
}
function clampDigits(el, max){
  el.value = el.value.replace(/\D/g,'').slice(0,2);
}
function fieldSeconds(mmEl, ssEl){
  const mm = parseInt(mmEl.value || '0', 10);
  const ss = parseInt(ssEl.value || '0', 10);
  return mm*60 + Math.min(ss,59);
}

// ---------- File selection ----------
dropzone.addEventListener('click', () => fileInput.click());
['dragover'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
dropzone.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});

function handleFile(file){
  currentFile = file;
  fileNameEl.textContent = file.name;
  fileDurationEl.textContent = 'Reading duration\u2026';
  fileRow.classList.remove('hidden');
  dropzone.classList.add('hidden');
  outputPanel.classList.remove('show');
  progressPanel.classList.remove('show');

  const url = URL.createObjectURL(file);
  sourcePreview.src = url;
  sourcePreview.classList.remove('hidden');

  sourcePreview.addEventListener('loadedmetadata', function onMeta(){
    sourcePreview.removeEventListener('loadedmetadata', onMeta);
    sourceDuration = sourcePreview.duration || 0;
    fileDurationEl.textContent = fmt(sourceDuration) + ' total';
    rangeTotal.textContent = '/ ' + fmt(sourceDuration);
    startMM.value = '00'; startSS.value = '00';
    const em = Math.floor(sourceDuration/60), es = Math.floor(sourceDuration%60);
    endMM.value = pad2(em); endSS.value = pad2(es);
    rangePanel.classList.remove('hidden');
    cutBtn.classList.remove('hidden');
    updateRangeUI();
  }, { once:true });
}

fileClear.addEventListener('click', () => {
  currentFile = null;
  fileInput.value = '';
  fileRow.classList.add('hidden');
  dropzone.classList.remove('hidden');
  sourcePreview.classList.add('hidden');
  rangePanel.classList.add('hidden');
  cutBtn.classList.add('hidden');
  outputPanel.classList.remove('show');
  progressPanel.classList.remove('show', 'error');
  exportError.classList.remove('show');
});

// ---------- Timecode inputs ----------
[startMM,startSS,endMM,endSS].forEach(el => {
  el.addEventListener('input', () => { clampDigits(el); updateRangeUI(); });
  el.addEventListener('blur', () => {
    if (el.value === '') el.value = '00';
    else el.value = pad2(parseInt(el.value,10) || 0);
    updateRangeUI();
  });
  el.addEventListener('focus', () => el.select());
});
startSS.addEventListener('input', () => { if (parseInt(startSS.value||'0',10) > 59) startSS.value = '59'; });
endSS.addEventListener('input', () => { if (parseInt(endSS.value||'0',10) > 59) endSS.value = '59'; });

function updateRangeUI(){
  const startSec = fieldSeconds(startMM, startSS);
  const endSec = fieldSeconds(endMM, endSS);
  const len = endSec - startSec;

  rangeLength.textContent = 'Clip length \u2014 ' + fmt(Math.max(0,len));

  let valid = true, msg = '';
  if (endSec > sourceDuration + 0.5){
    valid = false; msg = 'End time is past the end of the file.';
  } else if (len <= 0){
    valid = false; msg = 'End time must be after start time.';
  } else if (startSec < 0){
    valid = false; msg = 'Start time can\u2019t be negative.';
  }

  startBox.classList.toggle('invalid', !valid && startSec >= endSec);
  endBox.classList.toggle('invalid', !valid);
  rangeError.textContent = msg;
  rangeError.classList.toggle('show', !valid);
  cutBtn.disabled = !valid || !currentFile;

  return { startSec, endSec, valid };
}

// ---------- ffmpeg ----------
async function ensureFfmpeg(){
  if (ffmpeg) return ffmpeg;
  if (ffmpegLoading) return ffmpegLoading;

  ffmpegLoading = (async () => {
    progressStage.textContent = 'Loading engine\u2026';
    const instance = new FFmpeg();
    instance.on('log', ({ message }) => {
      console.log('[ffmpeg]', message);
    });
    instance.on('progress', ({ progress }) => {
      const pct = Math.min(100, Math.max(0, Math.round(progress*100)));
      progressFill.style.width = pct + '%';
      progressPct.textContent = pct + '%';
    });
    try {
      const coreURL = await toBlobURL(`${CORE_BASE}/ffmpeg-core.js`, 'text/javascript');
      const wasmURL = await toBlobURL(`${CORE_BASE}/ffmpeg-core.wasm`, 'application/wasm');
      // The @ffmpeg/ffmpeg package spawns its own worker via `new Worker(url)`,
      // which browsers block across origins regardless of CORS headers
      // (unlike fetch()). Blob-ifying it first keeps worker creation same-origin.
      const classWorkerURL = await toBlobURL(FFMPEG_WORKER_URL, 'text/javascript');
      await instance.load({ coreURL, wasmURL, classWorkerURL });
    } catch (loadErr) {
      // Reset so the next click retries a fresh load instead of
      // re-returning this same rejected promise forever.
      ffmpegLoading = null;
      throw new Error('Engine failed to load (' + (loadErr && loadErr.message ? loadErr.message : loadErr) + '). Check your connection and try again.');
    }
    ffmpeg = instance;
    return instance;
  })();

  return ffmpegLoading;
}

// ---------- Cut & export ----------
cutBtn.addEventListener('click', async () => {
  const { startSec, endSec, valid } = updateRangeUI();
  if (!valid || !currentFile) return;

  cutBtn.disabled = true;
  progressPanel.classList.add('show');
  progressPanel.classList.remove('error');
  exportError.classList.remove('show');
  outputPanel.classList.remove('show');
  progressFill.style.width = '0%';
  progressPct.textContent = '0%';
  progressStage.textContent = 'Loading engine\u2026';

  try {
    const engine = await ensureFfmpeg();

    progressStage.textContent = 'Reading file\u2026';
    const ext = (currentFile.name.split('.').pop() || 'mp3').toLowerCase();
    const inputName = 'input.' + ext;
    await engine.writeFile(inputName, await fetchFile(currentFile));

    progressStage.textContent = 'Trimming & encoding\u2026';
    await engine.exec([
      '-i', inputName,
      '-ss', startSec.toString(),
      '-to', endSec.toString(),
      '-vn',
      '-map', '0:a:0',
      '-c:a', 'libmp3lame',
      '-b:a', '320k',
      'output.mp3'
    ]);

    const data = await engine.readFile('output.mp3');
    const blob = new Blob([data.buffer], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(blob);

    outputPreview.src = url;
    const kb = (blob.size/1024);
    outputSize.textContent = kb > 1024 ? (kb/1024).toFixed(1)+' MB' : Math.round(kb)+' KB';

    const base = currentFile.name.replace(/\.[^.]+$/, '');
    downloadLink.href = url;
    downloadLink.download = `${base}_${fmt(startSec).replace(':','')}-${fmt(endSec).replace(':','')}.mp3`;

    progressFill.style.width = '100%';
    progressPct.textContent = '100%';
    outputPanel.classList.add('show');

    try { await engine.deleteFile(inputName); await engine.deleteFile('output.mp3'); } catch(e){}

    cutBtn.disabled = false;
    setTimeout(() => progressPanel.classList.remove('show'), 900);
  } catch (err) {
    console.error(err);
    const msg = (err && err.message) ? err.message : String(err);
    progressStage.textContent = 'Failed';
    progressFill.style.width = '0%';
    progressPct.textContent = '';
    progressPanel.classList.add('error');
    exportError.textContent = msg;
    exportError.classList.add('show');
    cutBtn.disabled = false;
    // Deliberately NOT auto-hiding here — the error needs to stay
    // on screen until the person retries or dismisses it.
  }
});

resetBtn.addEventListener('click', () => {
  fileClear.click();
  outputPanel.classList.remove('show');
});

// ---------- PWA install ----------
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  $('install-hint').classList.add('show');
});
$('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $('install-hint').classList.remove('show');
});

window.addEventListener('unhandledrejection', (e) => {
  console.error('Unhandled:', e.reason);
  if (progressPanel.classList.contains('show')) {
    const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
    progressStage.textContent = 'Failed';
    progressPanel.classList.add('error');
    exportError.textContent = msg;
    exportError.classList.add('show');
    cutBtn.disabled = false;
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
